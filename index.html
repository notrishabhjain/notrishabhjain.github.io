<script>
/* Runs before first paint so the chosen theme never flashes. */
(function(){
  try{
    var t=localStorage.getItem('theme');
    if(t!=='light'&&t!=='dark') t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
    document.documentElement.dataset.theme=t;
  }catch(e){/* keep the dark default */}
})();
</script>
<style>
/* ================================================================ tokens == */
:root{
  --bg:#191714; --panel:#211E1A; --panel-2:#282420;
  --line:#312C26; --line-2:#443D34;
  --txt:#F2EEE7; --txt-2:#B6AEA2; --mute:#8A8175;
  --accent:#D08A63; --accent-ink:#1A1512; --accent-soft:rgba(208,138,99,.14);
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:Newsreader,ui-serif,Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --rail:236px; --ease:cubic-bezier(.22,.75,.28,1);
}
html[data-theme="light"]{
  --bg:#F7F4ED; --panel:#FCFAF6; --panel-2:#F1ECE2;
  --line:#E3DCCF; --line-2:#CFC5B4;
  --txt:#201C17; --txt-2:#544C42; --mute:#8A8175;
  --accent:#B0562F; --accent-ink:#FFFFFF; --accent-soft:rgba(176,86,47,.09);
}
*,*::before,*::after{box-sizing:border-box}

/* ============================================================== app shell == */
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--txt);font-family:var(--sans);
  font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
.app{height:100dvh;display:grid;grid-template-columns:var(--rail) 1fr;overflow:hidden}
@supports not (height:100dvh){.app{height:100vh}}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute)}
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;min-height:0}
.scroll::-webkit-scrollbar{width:6px;height:6px}
.scroll::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}

/* =================================================================== rail == */
.rail{
  border-right:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;padding:22px 0;min-height:0;
}
.brand{padding:0 20px 20px;border-bottom:1px solid var(--line)}
.brand__n{font-family:var(--serif);font-size:17px;font-weight:500;letter-spacing:-.01em}
.brand__r{font-size:11px;color:var(--mute);margin-top:3px;font-family:var(--mono);letter-spacing:.08em}
.nav{display:flex;flex-direction:column;padding:12px 10px;gap:1px;flex:1;min-height:0;overflow:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav__b{
  position:relative;display:flex;align-items:center;gap:11px;
  padding:9px 12px;border-radius:6px;color:var(--txt-2);
  transition:color .2s var(--ease),background-color .2s var(--ease);
}
.nav__b::before{
  content:"";position:absolute;left:0;top:50%;width:2px;height:0;
  background:var(--accent);border-radius:2px;transform:translateY(-50%);
  transition:height .28s var(--ease);
}
.nav__b:hover{background:var(--panel-2);color:var(--txt)}
.nav__b[aria-current="true"]{color:var(--txt);background:var(--accent-soft)}
.nav__b[aria-current="true"]::before{height:17px}
.nav__i{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.06em;transition:color .2s}
.nav__b[aria-current="true"] .nav__i{color:var(--accent)}
.nav__t{font-size:13.5px;font-weight:500}
.rail__foot{padding:14px 20px 0;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px}
.tgl{
  display:flex;align-items:center;gap:8px;padding:7px 11px;border:1px solid var(--line-2);
  border-radius:999px;color:var(--txt-2);transition:border-color .2s,color .2s;
}
.tgl:hover{border-color:var(--accent);color:var(--accent)}
.tgl svg{width:14px;height:14px;transition:transform .45s var(--ease)}
.tgl:hover svg{transform:rotate(28deg)}
.tgl span{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.kbd{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--mute);letter-spacing:.06em}

/* ================================================================== stage == */
.stage{position:relative;min-height:0;display:grid;overflow:hidden}
.view{
  grid-area:1/1;display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;overflow:hidden;
  padding:34px 40px 34px;opacity:0;visibility:hidden;pointer-events:none;
  transform:translateY(10px);
  transition:opacity .34s var(--ease),transform .34s var(--ease),visibility .34s;
}
.view.on{opacity:1;visibility:visible;pointer-events:auto;transform:none}
.vhead{display:flex;align-items:baseline;gap:14px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:22px}
.vhead h2{margin:0;font-family:var(--serif);font-size:22px;font-weight:500;letter-spacing:-.012em}
.vhead>.mono:last-of-type{margin-left:auto}
.vbody{min-height:0}
/* content-light panels sit optically centred; `safe` falls back to top when they overflow */
.vbody.scroll{display:grid;grid-template-columns:minmax(0,1fr);align-content:safe center}

/* staggered entrance for children of the active view */
.view.on .st{animation:rise .5s var(--ease) both}
.view.on .st:nth-child(1){animation-delay:.04s}
.view.on .st:nth-child(2){animation-delay:.09s}
.view.on .st:nth-child(3){animation-delay:.14s}
.view.on .st:nth-child(4){animation-delay:.19s}
.view.on .st:nth-child(5){animation-delay:.24s}
.view.on .st:nth-child(6){animation-delay:.29s}
@keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

/* =================================================================== home == */
.home{display:flex;flex-direction:column;justify-content:center;height:100%;min-height:0}
.home h1{
  margin:0;font-family:var(--serif);font-size:clamp(36px,5.4vw,66px);font-weight:400;
  letter-spacing:-.021em;line-height:1.05;
}
.home h1 em{font-style:italic;color:var(--accent)}
.home__tag{color:var(--txt-2);font-size:clamp(14px,1.5vw,17px);margin-top:16px;max-width:52ch}
.home__loc{margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:30px;border-radius:4px;overflow:hidden}
.stat{background:var(--bg);padding:16px 18px}
.stat__v{font-family:var(--serif);font-size:clamp(22px,2.6vw,31px);font-weight:500;letter-spacing:-.018em;font-variant-numeric:tabular-nums}
.stat__l{font-size:11.5px;color:var(--mute);margin-top:4px;line-height:1.4}
.home__cta{display:flex;flex-wrap:wrap;gap:9px;margin-top:26px}
.btn{
  position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;
  padding:11px 16px;border:1px solid var(--line-2);border-radius:6px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
  transition:color .22s,border-color .22s;
}
.btn::before{content:"";position:absolute;inset:0;background:var(--accent);transform:translateY(101%);transition:transform .32s var(--ease);z-index:-1}
.btn:hover::before{transform:none}
.btn:hover{color:var(--accent-ink);border-color:var(--accent)}
.btn--f{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn--f::before{background:var(--txt)}
.btn--f:hover{color:var(--bg);border-color:var(--txt)}
</style>
<style>
/* ================================================================== split == */
.split{display:grid;grid-template-columns:290px 1fr;gap:26px;height:100%;min-height:0}
.picker{display:flex;flex-direction:column;gap:2px;padding-right:6px;min-height:0}
.pick{
  position:relative;text-align:left;padding:11px 13px;border-radius:7px;
  border:1px solid transparent;transition:background-color .2s var(--ease),border-color .2s var(--ease),transform .2s var(--ease);
}
.pick::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;background:var(--accent);
  border-radius:2px;transform:scaleY(0);transform-origin:center;transition:transform .26s var(--ease);
}
.pick:hover{background:var(--panel);transform:translateX(2px)}
.pick[aria-selected="true"]{background:var(--panel);border-color:var(--line-2)}
.pick[aria-selected="true"]::before{transform:scaleY(1)}
.pick__t{font-family:var(--serif);font-size:14.5px;font-weight:500;display:block;line-height:1.3}
.pick__m{font-size:11px;color:var(--mute);margin-top:3px;display:block;line-height:1.35}
.pick__s{font-family:var(--mono);font-size:10px;color:var(--accent);margin-top:5px;display:block;letter-spacing:.05em}

.detail{min-height:0;padding-right:8px}
.detail__h{font-family:var(--serif);font-size:24px;font-weight:500;letter-spacing:-.015em;margin:0;line-height:1.15}
.detail__sub{color:var(--mute);font-size:12px;margin-top:5px;font-family:var(--mono);letter-spacing:.04em}
.detail__stat{margin-top:14px;font-size:14px;color:var(--txt-2)}
.detail__stat b{color:var(--accent);font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:7px 22px;margin-top:16px;padding:13px 0;border-block:1px solid var(--line)}
.meta div{font-size:11.5px}
.meta span{color:var(--mute);font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;display:block;margin-bottom:2px}
.blk{margin-top:18px}
.blk__h{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--accent);margin-bottom:7px}
.blk p{color:var(--txt-2);font-size:13.5px}
.blk ul{margin:0;padding-left:16px;color:var(--txt-2);font-size:13.5px}
.blk li{margin-bottom:6px}
.blk li:last-child{margin-bottom:0}
.cols{display:grid;gap:18px}
@media(min-width:1180px){.cols{grid-template-columns:1fr 1fr;gap:18px 30px}}

.hlist{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:6px}
.hrow{background:var(--panel);padding:11px 14px;font-size:13px;color:var(--txt-2)}
.hrow b{color:var(--txt);font-weight:600}

/* =================================================================== grid == */
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));align-content:start}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:16px 17px;
  transition:border-color .22s var(--ease),transform .22s var(--ease);
}
.card:hover{border-color:var(--line-2);transform:translateY(-2px)}
.card__t{font-family:var(--serif);font-size:15.5px;font-weight:500;letter-spacing:-.005em}
.card__m{font-size:11.5px;color:var(--mute);margin-top:3px}
.card__d{font-size:12.5px;color:var(--txt-2);margin-top:9px;line-height:1.5}
.group-label{margin:0 0 10px}
.group+.group{margin-top:22px}

/* ================================================================ contact == */
.contact{display:flex;flex-direction:column;justify-content:center;height:100%;min-height:0;max-width:620px}
.contact h3{margin:0;font-family:var(--serif);font-size:clamp(28px,3.8vw,44px);font-weight:400;letter-spacing:-.018em;line-height:1.14}
.contact p{color:var(--txt-2);margin-top:14px;font-size:15px}
.clist{margin-top:26px;border-top:1px solid var(--line)}
.crow{
  display:flex;align-items:center;gap:14px;padding:15px 4px;border-bottom:1px solid var(--line);
  transition:padding-left .24s var(--ease),color .2s;
}
.crow:hover{padding-left:12px;color:var(--accent)}
.crow__k{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--mute);width:78px;flex:none}
.crow__v{font-size:14px}
.crow__a{margin-left:auto;color:var(--mute);transition:transform .24s var(--ease),color .2s}
.crow:hover .crow__a{transform:translateX(4px);color:var(--accent)}


/* Short viewports: the Overview carries the most stacked content, so it
   tightens rather than clipping. */
@media(max-height:800px){
  .stats{margin-top:18px}
  .stat{padding:12px 16px}
  .home__tag{margin-top:12px}
  .home__cta{margin-top:18px}
  .view{padding-block:24px}
}
@media(max-height:680px){
  .home__loc{display:none}
}

/* ============================================================== responsive == */
.topbar{display:none}
@media(max-width:900px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto}
  .rail{display:none}
  .topbar{
    display:flex;align-items:center;gap:12px;padding:13px 18px;
    border-bottom:1px solid var(--line);background:var(--panel);
  }
  .view{padding:22px 18px}
  .split{grid-template-columns:1fr;gap:14px;grid-template-rows:auto minmax(0,1fr)}
  .picker{flex-direction:row;overflow-x:auto;gap:7px;padding-bottom:5px;flex:none}
  .picker .pick{flex:none;min-width:186px}
  .pick::before{top:auto;bottom:0;left:12px;right:12px;width:auto;height:2px;transform:scaleX(0)}
  .pick[aria-selected="true"]::before{transform:scaleX(1)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .cols{grid-template-columns:1fr}
  .botnav{
    display:flex;gap:3px;padding:7px 10px;border-top:1px solid var(--line);
    background:var(--panel);overflow-x:auto;scrollbar-width:none;
    padding-bottom:max(7px,env(safe-area-inset-bottom));
  }
  .botnav::-webkit-scrollbar{display:none}
  .botnav button{
    flex:none;padding:8px 13px;border-radius:999px;font-size:12px;font-weight:500;
    color:var(--txt-2);white-space:nowrap;transition:background-color .2s,color .2s;
  }
  .botnav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
}
@media(min-width:901px){.botnav{display:none}}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .view{transform:none}
}
</style>
</head>

</div>

let current = null;

function show(id, { focus = false } = {}) {
  if (id === current) return;
  current = id;
  document.querySelectorAll('.view').forEach((v) => v.classList.toggle('on', v.id === `v-${id}`));
  document.querySelectorAll('[data-go]').forEach((b) => {
    if (b.closest('#nav') || b.closest('#botnav')) {
      b.setAttribute('aria-current', String(b.dataset.go === id));
    }
  });
  const active = document.querySelector(`#botnav button[aria-current="true"]`);
  active?.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  countUp();
  if (focus) document.getElementById(`v-${id}`)?.focus?.();
}

document.addEventListener('click', (e) => {
  const t = e.target.closest('[data-go]');
  if (t) show(t.dataset.go);
});

/* Arrow keys move between sections; number keys jump straight to one. */
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = document.activeElement?.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  const i = sections.findIndex((s) => s.id === current);
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    e.preventDefault(); show(sections[(i + 1) % sections.length].id);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault(); show(sections[(i - 1 + sections.length) % sections.length].id);
  } else if (/^[1-9]$/.test(e.key) && sections[Number(e.key) - 1]) {
    show(sections[Number(e.key) - 1].id);
  }
});

/* ============================================================ stat counters == */

let counted = false;
function countUp() {
  if (counted || current !== 'home') return;
  counted = true;
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('[data-count]').forEach((el) => {
    const target = Number(el.dataset.count);
    if (still || !Number.isFinite(target)) { el.textContent = String(target); return; }
    const t0 = performance.now(), dur = 900;
    const tick = (now) => {
      const p = Math.min((now - t0) / dur, 1);
      el.textContent = String(Math.round(target * (1 - Math.pow(1 - p, 3))));
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  });
}

/* ==================================================================== theme == */

const root = document.documentElement;
const tglText = document.getElementById('tgl-t');

function setTheme(next) {
  root.dataset.theme = next;
  if (tglText) tglText.textContent = next === 'dark' ? 'Dark' : 'Light';
  document.querySelector('meta[name="theme-color"]')
    ?.setAttribute('content', next === 'dark' ? '#191714' : '#F7F4ED');
  try { localStorage.setItem('theme', next); } catch { /* preference just won't persist */ }
}

/* The head script already applied the theme; just sync the label. */
if (tglText) tglText.textContent = root.dataset.theme === 'dark' ? 'Dark' : 'Light';

['tgl', 'tgl-m'].forEach((id) => {
  document.getElementById(id)?.addEventListener('click', () => {
    setTheme(root.dataset.theme === 'dark' ? 'light' : 'dark');
  });
});

show('home');
</script>
</body>
</html>
