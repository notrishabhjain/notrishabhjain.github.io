name: Deploy site

# The site is static HTML, CSS and one small script with no build step: a
# homepage plus a page per case study under work/. This workflow only publishes
# the repository as-is, so Pages can stay on its "GitHub Actions" source without
# anyone changing a repository setting. Note that it uploads the WHOLE
# repository, so anything committed here becomes publicly fetchable.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
